<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konrad Ołdakowski (55821) - AI LAB B</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <h1>Lista zadań TODO</h1>
    <div class="search-list">
        <input id="search" type="text" placeholder="Wyszukaj zadanie">
    </div>
    <div id="todo-list">
    </div>
    <form id="add-task">
        <input id="task-name" type="text" placeholder="Do zrobienia.." minlength="3" maxlength="255" required>
        <input id="task-date" type="date">
        <button type="submit">Dodaj zadanie</button>
    </form>
</body>
</html>
