<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konrad Ołdakowski (55821) - AI LAB D</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
    <h1>Pogodynka</h1>
    <p>Prognoza pogody w wybranym mieście</p>
    </header>
    <form id="weatherForm">
        <input type="text" id="cityInput" placeholder="Wpisz miasto" required>
        <button type="submit">Pogoda</button>
    </form>
    <section id="currentWeather">
        <h2>Aktualna pogoda</h2>
            <div id="currentResult"></div>
    </section>
    <section id="forecastWeather">
        <h2>Prognoza pogody na 5 dni</h2>
        <div id="forecastResult"></div>
    </section>
</body>
</html>
